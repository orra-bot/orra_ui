name: orra_ui
description: 面向 Flutter 桌面端的可配置设计系统与组件库（默认 Linear 风格主题）。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  orra_guardrails:
    path: ../orra_guardrails

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/InterVariable.ttf
