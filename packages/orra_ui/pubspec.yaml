name: orra_ui
description: "A configurable design system and component library for Flutter desktop (macOS, Windows, Linux) and the web."
version: 0.1.0
repository: https://github.com/orra-bot/orra_ui
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  orra_guardrails:
    path: ../orra_guardrails

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/InterVariable.ttf
