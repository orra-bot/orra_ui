name: orra_desktop_shell
description: "Window shell for orra_ui: frameless window, sidebar + content panel, caption buttons, window state, menu bar and shortcuts. Also runs on the web."
version: 0.1.0
repository: https://github.com/orra-bot/orra_ui
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  orra_ui:
    path: ../orra_ui
  path_provider: 2.1.6
  screen_retriever: 0.2.2
  web: 1.1.1
  window_manager: 0.5.2

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  orra_guardrails:
    path: ../orra_guardrails

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: OrraDesktopShellPlugin
