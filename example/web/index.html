<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="orra_ui component gallery.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="orra gallery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>orra gallery</title>
  <link rel="manifest" href="manifest.json">

  <!--
    首帧前的页面底色 = 主题的 chrome（RaColors.surfaceWindow），与 macOS 原生窗口底色同理，避免加载时闪白。
    Flutter 启动后由 RaDesktopFrame 按实际主题接管（<body> 背景与 theme-color）。
    改动这两个值时同步 RaColors；example/test/native_window_test.dart 会校验。
  -->
  <meta name="theme-color" content="#efeff0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --ra-chrome-light: #efeff0;
      --ra-chrome-dark: #09090a;
    }
    html, body { margin: 0; height: 100%; }
    body { background-color: var(--ra-chrome-light); }
    @media (prefers-color-scheme: dark) {
      body { background-color: var(--ra-chrome-dark); }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
