name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: orra_guardrails
        working-directory: packages/orra_guardrails
        run: dart test
      - name: orra_ui
        working-directory: packages/orra_ui
        run: flutter test
      - name: orra_desktop_shell
        working-directory: packages/orra_desktop_shell
        run: flutter test
      - name: example
        working-directory: example
        run: flutter test

  test-web:
    name: Test (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: orra_ui
        working-directory: packages/orra_ui
        run: flutter test --platform chrome
      - name: orra_desktop_shell
        working-directory: packages/orra_desktop_shell
        run: flutter test --platform chrome test/web_test.dart test/page_style_browser_test.dart
      - name: example
        working-directory: example
        run: flutter test --platform chrome

  build:
    name: Build gallery (${{ matrix.target }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
            command: flutter build macos --release
          - target: windows
            os: windows-latest
            command: flutter build windows --release
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
          - target: web-js
            os: ubuntu-latest
            command: flutter build web --release
          - target: web-wasm
            os: ubuntu-latest
            command: flutter build web --release --wasm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: Build
        working-directory: example
        run: ${{ matrix.command }}
